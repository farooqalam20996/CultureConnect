version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.0

    steps:
      - checkout

      - run:
          name: Install Dependencies
          command: npm install --legacy-peer-deps

      - run:
          name: Run Tests
          command: npm test

      - run:
          name: Build Project
          command: npm run build

workflows:
  build_and_test:
    jobs:
      - build